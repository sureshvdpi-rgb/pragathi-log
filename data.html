<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Data Management | Pragathi Log</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f0f0f; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; padding-bottom: 120px;
        }

        h1 { 
            font-size: 2.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; 
            background: linear-gradient(to bottom, #fff, #888); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-top: 10px; text-align: center;
        }

        .divider { width: 40px; height: 4px; background-color: #fff; margin: 5px auto 25px; border-radius: 10px; opacity: 0.8; }

        .settings-card {
            width: 100%; max-width: 420px;
            background: #1a1a1a; border-radius: 30px; padding: 25px;
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stats-banner {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
            margin-bottom: 25px; padding: 15px;
            background: rgba(255, 255, 255, 0.03); border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 1.0rem; font-weight: 900; color: #00ffaa; }
        .stat-lbl { display: block; font-size: 0.7rem; color: #666; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-top: 4px; }

        .form-group { margin-bottom: 25px; }
        label { display: block; font-size: 0.65rem; color: #666; text-transform: uppercase; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
        input { width: 100%; background: #252525; border: 1px solid #333; border-radius: 15px; padding: 15px; color: white; font-size: 1.1rem; font-weight: 600; outline: none; }

        .btn-stack { display: flex; flex-direction: column; gap: 12px; }
        .control-btn { 
            width: 100%; background: #252525; color: #eee; 
            padding: 18px; border-radius: 20px; border: 1px solid #333; 
            font-weight: 800; text-transform: uppercase; 
            font-size: 0.75rem; cursor: pointer; transition: 0.2s; 
            text-align: center;
        }
        .btn-primary { background: #fff; color: #000; border: none; font-weight: 900; }
        .btn-cleanup { color: #ffcc00; border-color: rgba(255, 204, 0, 0.2); }
        .btn-danger { color: #ff4d4d; border-color: rgba(255, 77, 77, 0.2); }
        
        .back-nav { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        .back-btn { background-color: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); color: #fff; text-decoration: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; padding: 16px 40px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 100px; }
    </style>
</head>
<body>

    <h1>DATA</h1>
    <div class="divider"></div>

    <div class="settings-card">
        <div class="stats-banner">
            <div class="stat-item">
                <span class="stat-val" id="storage-size">0 KB</span>
                <span class="stat-lbl">Size Used</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="log-count">0</span>
                <span class="stat-lbl">Records</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="last-backup-ts" style="font-size: 0.8rem;">Never</span>
                <span class="stat-lbl">Last Backup</span>
            </div>
        </div>

        <div class="form-group">
            <label>Backup Alert Frequency (Days)</label>
            <input type="number" id="backup-freq" placeholder="e.g. 2" oninput="saveBackupFreq(this.value)">
            <p style="font-size: 0.55rem; color: #555; margin-top: 8px; text-transform: uppercase; font-weight: 700;">Remind me to backup every X days</p>
        </div>

        <div class="btn-stack">
            <button class="control-btn btn-primary" onclick="exportData()">↑ Export Backup File</button>
            <button class="control-btn" onclick="document.getElementById('fileImport').click()">↓ Import Backup File</button>
            <button class="control-btn btn-cleanup" onclick="deleteOldLogs()">✕ Delete Logs > 90 Days</button>
            <button class="control-btn btn-danger" onclick="clearAllData()">✕ Clear All Local Data</button>
        </div>
        <input type="file" id="fileImport" style="display:none" accept=".json" onchange="importData(event)">
    </div>

    <div class="back-nav"><a href="./index.html" class="back-btn">← Home</a></div>

    <script>
        window.onload = () => {
            document.getElementById('backup-freq').value = localStorage.getItem('backup_freq_days') || 7;
            calculateDataStats();
        };

        function calculateDataStats() {
            let totalChars = JSON.stringify(localStorage).length;
            let sizeInKB = (totalChars / 1024).toFixed(2);
            document.getElementById('storage-size').innerText = sizeInKB + " KB";

            const logs = JSON.parse(localStorage.getItem('user_logs') || '[]');
            document.getElementById('log-count').innerText = logs.length;

            const lastBackup = localStorage.getItem('last_backup_date');
            if (lastBackup) {
                const dateObj = new Date(parseInt(lastBackup));
                document.getElementById('last-backup-ts').innerText = dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ", " + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }

        function saveBackupFreq(val) {
            localStorage.setItem('backup_freq_days', val || 7);
        }

        function deleteOldLogs() {
            const logs = JSON.parse(localStorage.getItem('user_logs') || '[]');
            if (logs.length === 0) {
                alert("No logs found to delete.");
                return;
            }

            const cutoff = Date.now() - (90 * 24 * 60 * 60 * 1000);
            const filteredLogs = logs.filter(log => new Date(log.timestamp).getTime() >= cutoff);
            const deletedCount = logs.length - filteredLogs.length;

            if (deletedCount === 0) {
                alert("No logs are older than 90 days.");
                return;
            }

            if (confirm(`Are you sure? This will permanently delete ${deletedCount} records older than 90 days.`)) {
                localStorage.setItem('user_logs', JSON.stringify(filteredLogs));
                
                // Sync glucose_logs for dashboard consistency
                const glucoseOnly = filteredLogs
                    .filter(l => l.glucose !== '--')
                    .map(l => ({
                        value: l.glucose,
                        time: new Date(l.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                        date: l.timestamp.split('T')[0],
                        timestamp: l.timestamp
                    }));
                localStorage.setItem('glucose_logs', JSON.stringify(glucoseOnly));

                calculateDataStats();
                alert(`Cleanup complete: ${deletedCount} logs removed.`);
            }
        }

        function exportData() {
            const data = {}; 
            Object.keys(localStorage).forEach(k => data[k] = localStorage.getItem(k));
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'})); 
            a.download = `Pragathi_Backup_${new Date().toISOString().split('T')[0]}.json`; 
            a.click();
            
            localStorage.setItem('last_backup_date', Date.now().toString());
            calculateDataStats();
            alert("Backup exported successfully!");
        }

        function importData(event) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result); 
                    if (confirm("This will replace all current data. Continue?")) {
                        localStorage.clear();
                        Object.keys(data).forEach(k => localStorage.setItem(k, data[k])); 
                        location.href = './index.html';
                    }
                } catch (err) { alert("Invalid file format."); }
            };
            reader.readAsText(event.target.files[0]);
        }

        function clearAllData() { 
            if (confirm("PERMANENTLY DELETE ALL LOGS AND SETTINGS? This cannot be undone.")) { 
                localStorage.clear(); 
                location.href = './index.html'; 
            } 
        }
    </script>
</body>
</html>
