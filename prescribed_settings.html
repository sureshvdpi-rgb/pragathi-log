<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dosage Settings | Pragathi Log</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f0f0f; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; padding-bottom: 120px;
        }

        h1 { 
            font-size: 2.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; 
            background: linear-gradient(to bottom, #fff, #888); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-top: 10px; text-align: center;
        }

        .divider { width: 40px; height: 4px; background-color: #fff; margin: 5px auto 25px; border-radius: 10px; opacity: 0.8; }

        .settings-card {
            width: 100%; max-width: 420px;
            background: #1a1a1a; border-radius: 30px; padding: 25px;
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; font-size: 0.65rem; color: #666; 
            text-transform: uppercase; font-weight: 800; 
            margin-bottom: 8px; letter-spacing: 1px;
        }

        input { 
            width: 100%; background: #252525; border: 1px solid #333; 
            border-radius: 15px; padding: 15px; color: white; 
            font-size: 1.1rem; font-weight: 600; outline: none; 
            transition: border-color 0.3s;
        }
        
        input:focus { border-color: #007aff; }
        input:disabled { color: #00ffaa; border-color: rgba(0, 255, 170, 0.2); }

        .isf-highlight {
            background: rgba(0, 255, 170, 0.05);
            padding: 15px;
            border-radius: 20px;
            border: 1px dashed rgba(0, 255, 170, 0.2);
            margin-bottom: 20px;
        }

        .save-btn { 
            width: 100%; background: #fff; color: #000; 
            padding: 18px; border-radius: 100px; border: none; 
            font-weight: 900; text-transform: uppercase; 
            letter-spacing: 2px; font-size: 0.8rem; 
            cursor: pointer; transition: 0.2s; 
            margin-top: 10px;
        }
        
        .save-btn:active { transform: scale(0.96); }

        .back-nav { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; z-index: 1000; }
        .back-btn { 
            background-color: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); 
            color: #fff; text-decoration: none; font-size: 0.75rem; 
            text-transform: uppercase; letter-spacing: 2px; font-weight: 700; 
            padding: 16px 40px; border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 100px; 
        }
    </style>
</head>
<body>

    <h1>ISF</h1>
    <div class="divider"></div>

    <div class="settings-card">
        <div class="form-group">
            <label>Breakfast Dosage (Units)</label>
            <input type="number" id="dose-breakfast" step="0.5" placeholder="0.0" oninput="calculateISF()">
        </div>
        <div class="form-group">
            <label>Lunch Dosage (Units)</label>
            <input type="number" id="dose-lunch" step="0.5" placeholder="0.0" oninput="calculateISF()">
        </div>
        <div class="form-group">
            <label>Dinner Dosage (Units)</label>
            <input type="number" id="dose-dinner" step="0.5" placeholder="0.0" oninput="calculateISF()">
        </div>
        <div class="form-group">
            <label>Daily Basal Dosage (Units)</label>
            <input type="number" id="dose-basal" step="0.5" placeholder="0.0" oninput="calculateISF()">
        </div>

        <div class="isf-highlight">
            <label style="color: #00ffaa;">Calculated ISF (Insulin Sensitivity)</label>
            <input type="text" id="dose-isf" disabled value="--">
            <p style="font-size: 0.5rem; color: #555; margin-top: 8px; text-transform: uppercase; font-weight: 700;">
                Calculation: 1800 / Total Daily Insulin Dose
            </p>
        </div>
        
        <button class="save-btn" onclick="saveDosages()">Save Configuration</button>
    </div>

    <div class="back-nav">
        <a href="./index.html" class="back-btn">← Home</a>
    </div>

    <script>
        function calculateISF() {
            const b = parseFloat(document.getElementById('dose-breakfast').value || 0);
            const l = parseFloat(document.getElementById('dose-lunch').value || 0);
            const d = parseFloat(document.getElementById('dose-dinner').value || 0);
            const basal = parseFloat(document.getElementById('dose-basal').value || 0);
            
            const tdd = b + l + d + basal;
            const isfInput = document.getElementById('dose-isf');

            if (tdd > 0) {
                // Using the 1800 Rule for ISF calculation
                const isf = Math.round(1800 / tdd);
                isfInput.value = isf + " mg/dL";
                return isf;
            } else {
                isfInput.value = "--";
                return null;
            }
        }

        function saveDosages() {
            const b = document.getElementById('dose-breakfast').value;
            const l = document.getElementById('dose-lunch').value;
            const d = document.getElementById('dose-dinner').value;
            const basal = document.getElementById('dose-basal').value;
            const isf = calculateISF();

            localStorage.setItem('prescribed_breakfast', b);
            localStorage.setItem('prescribed_lunch', l);
            localStorage.setItem('prescribed_dinner', d);
            localStorage.setItem('prescribed_basal', basal);
            if(isf) localStorage.setItem('prescribed_isf', isf);
            
            if(basal) localStorage.setItem('last_basal_dose', basal);
            
            alert("Settings updated successfully!");
            location.href = './index.html';
        }

        window.onload = () => {
            document.getElementById('dose-breakfast').value = localStorage.getItem('prescribed_breakfast') || '';
            document.getElementById('dose-lunch').value = localStorage.getItem('prescribed_lunch') || '';
            document.getElementById('dose-dinner').value = localStorage.getItem('prescribed_dinner') || '';
            document.getElementById('dose-basal').value = localStorage.getItem('prescribed_basal') || '';
            calculateISF();
        };
    </script>
</body>
</html>
